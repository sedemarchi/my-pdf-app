<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFプレビュー & 保存</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #e5322d;
            --primary-hover: #c92b27;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Minimal Toolbar */
        .viewer-header {
            height: 48px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 10;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .header-logo {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .doc-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .stats-badge {
            background: #f1f5f9;
            color: #334155;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            border: 1px solid #e2e8f0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-action-primary {
            background: var(--primary-red);
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            box-shadow: 0 2px 4px rgba(229, 50, 45, 0.2);
            white-space: nowrap;
        }

        .btn-action-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-action-secondary {
            background: #ffffff;
            color: #334155;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-action-secondary:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .btn-action-close {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-action-close:hover {
            background: #fee2e2;
            color: var(--primary-red);
        }

        /* Full Height PDF View Container */
        .viewer-body {
            flex: 1;
            width: 100%;
            height: calc(100% - 48px);
            background: #334155;
            position: relative;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Overlay inside Viewer */
        .loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 5;
            color: var(--text-dark);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid var(--primary-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="viewer-header">
        <div class="header-left">
            <img src="favicon.png" alt="PDF Icon" class="header-logo">
            <span class="doc-title" id="doc-title">PDFプレビュー</span>
        </div>

        <div class="header-center">
            <div class="stats-badge" id="stats-badge">
                <span id="page-count"><i class="fa-solid fa-file-lines"></i> 計 - ページ</span>
                <span>•</span>
                <span id="file-size"><i class="fa-solid fa-hard-drive"></i> - KB</span>
            </div>
        </div>

        <div class="header-right">
            <button type="button" class="btn-action-primary" id="download-btn">
                <i class="fa-solid fa-download"></i> 保存 / ダウンロード
            </button>
            <button type="button" class="btn-action-secondary" id="print-btn" title="印刷">
                <i class="fa-solid fa-print"></i> 印刷
            </button>
            <button type="button" class="btn-action-close" id="close-btn" title="タブを閉じる">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </header>

    <main class="viewer-body">
        <div class="loading-screen" id="loading-screen">
            <div class="spinner"></div>
            <p style="font-size: 0.85rem; font-weight: 600; color: #64748b;">プレビューを読み込んでいます...</p>
        </div>
        <iframe id="pdf-frame" class="pdf-frame" src=""></iframe>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const resultId = params.get('id');

            const docTitle = document.getElementById('doc-title');
            const pageCount = document.getElementById('page-count');
            const fileSize = document.getElementById('file-size');
            const downloadBtn = document.getElementById('download-btn');
            const printBtn = document.getElementById('print-btn');
            const closeBtn = document.getElementById('close-btn');
            const pdfFrame = document.getElementById('pdf-frame');
            const loadingScreen = document.getElementById('loading-screen');

            if (!resultId) {
                loadingScreen.innerHTML = '<p style="color:#ef4444; font-weight:bold;">⚠️ プレビューIDが指定されていません。</p>';
                return;
            }

            function formatSize(bytes) {
                if (!bytes) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            try {
                // Fetch document details
                const res = await fetch(`/api/result-info/${resultId}`);
                if (!res.ok) throw new Error("ドキュメント情報が見つかりません");
                const data = await res.json();

                docTitle.textContent = data.filename;
                document.title = `${data.filename} - プレビュー`;
                pageCount.innerHTML = `<i class="fa-solid fa-file-lines"></i> 全 ${data.page_count} ページ`;
                fileSize.innerHTML = `<i class="fa-solid fa-hard-drive"></i> ${formatSize(data.size)}`;

                // Load PDF in iframe
                pdfFrame.src = `/api/view-pdf/${resultId}#toolbar=1`;
                pdfFrame.onload = () => {
                    loadingScreen.classList.add('hidden');
                };

                // Fallback hide loading screen after 1.5s
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 1500);

                // Download Action
                downloadBtn.addEventListener('click', () => {
                    const dlUrl = `/api/download-result/${resultId}`;
                    const a = document.createElement('a');
                    a.href = dlUrl;
                    a.download = data.filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });

                // Print Action
                printBtn.addEventListener('click', () => {
                    try {
                        if (pdfFrame.contentWindow) {
                            pdfFrame.contentWindow.print();
                        } else {
                            window.open(`/api/view-pdf/${resultId}`, '_blank');
                        }
                    } catch (e) {
                        window.open(`/api/view-pdf/${resultId}`, '_blank');
                    }
                });

                // Close Action
                closeBtn.addEventListener('click', () => {
                    window.close();
                });

            } catch (e) {
                console.error(e);
                loadingScreen.innerHTML = `<p style="color:#ef4444; font-weight:bold;">⚠️ 読み込みエラー: ${e.message}</p>`;
            }
        });
    </script>
</body>
</html>

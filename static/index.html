<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local iLovePDF - 万能ツール</title>
    <link rel="stylesheet" href="css/style.css?v=5.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="widget-body">
    <!-- Slim Compact Header (Takes only ~42px, fits Google Sites iframe) -->
    <header class="compact-header">
        <div class="logo">
            <img src="favicon.png" alt="Logo" class="logo-icon">
            <span class="logo-title">Local iLovePDF</span>
        </div>

        <div class="header-right-controls">
            <!-- Mode Toggle: PDF Tools vs Auto-Print -->
            <div class="mode-toggle-wrap">
                <label class="switch-compact">
                    <input type="checkbox" id="auto-print-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="toggle-text"><i class="fa-solid fa-bolt"></i> 投げ込み即時印刷</span>
                <span class="badge-status badge-off" id="print-mode-status">OFF</span>
            </div>

            <!-- Print Settings Inline (Shown only when Print Mode is ON) -->
            <div id="quick-print-panel" class="quick-print-inline hidden">
                <div class="control-item">
                    <i class="fa-solid fa-print"></i>
                    <select id="printer-select" class="select-compact">
                        <option value="">プリンター取得中...</option>
                    </select>
                </div>
                <div class="control-item">
                    <span class="item-label">部数:</span>
                    <input type="number" id="print-copies-input" min="1" max="99" value="1" class="input-copies-compact">
                </div>
                <label class="checkbox-compact" title="複数ファイルをまとめて1つの印刷ジョブで連続印刷">
                    <input type="checkbox" id="print-merge-check" checked>
                    <span>結合印刷</span>
                </label>
                <button type="button" id="refresh-printers-btn" class="btn-icon-mini" title="プリンター再取得">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="widget-main">
        <!-- 1. The Immediate Drop Zone (Visible by default, zero scrollbar needed) -->
        <div id="drop-zone" class="widget-drop-zone">
            <i class="fa-solid fa-cloud-arrow-up drop-icon" id="drop-icon"></i>
            <div class="drop-text-group">
                <h2 id="drop-title">ここにPDFファイルをドロップ</h2>
                <span class="drop-subtitle">または <button type="button" class="btn-select-file" id="file-select-btn">ファイルを選択</button></span>
            </div>
            <div id="drop-print-badge" class="drop-print-badge hidden">
                <i class="fa-solid fa-print"></i> ドロップすると指定プリンターで直ちに印刷が始まります
            </div>
            <input type="file" id="file-input" multiple accept=".pdf" style="display: none;">
        </div>

        <!-- 2. Action Panel (Revealed immediately when file(s) are dropped!) -->
        <div id="file-list-container" class="file-action-container hidden">
            <!-- Top compact info bar -->
            <div class="action-top-bar">
                <div class="top-bar-left">
                    <span id="file-count" class="badge-count">0 ファイル</span>
                    <div class="sort-toolbar-mini">
                        <button id="sort-date-btn" class="btn-mini btn-outline" title="スキャン日時順"><i class="fa-solid fa-clock"></i> 日時順</button>
                        <button id="sort-name-btn" class="btn-mini btn-outline" title="ファイル名順"><i class="fa-solid fa-arrow-down-a-z"></i> 名前順</button>
                    </div>
                </div>

                <div class="top-bar-right">
                    <button id="add-more-btn" class="btn-mini btn-outline"><i class="fa-solid fa-plus"></i> 追加</button>
                    <button id="clear-all-btn" class="btn-mini btn-danger-outline"><i class="fa-solid fa-xmark"></i> やり直す</button>
                </div>
            </div>

            <!-- Compact Thumbnails / Horizontal File List -->
            <div id="file-list" class="file-list-horizontal">
                <!-- Cards injected by JS -->
            </div>

            <!-- Output filename (compact inline) -->
            <div class="output-filename-compact" id="output-filename-box">
                <label for="output-filename-input"><i class="fa-solid fa-wand-magic-sparkles"></i> 出力保存名:</label>
                <input type="text" id="output-filename-input" class="input-filename-compact" placeholder="出力ファイル名..." />
                <button type="button" id="suggest-name-btn" class="btn-mini btn-outline" title="再解析"><i class="fa-solid fa-wand-magic-sparkles"></i> 再解析</button>
            </div>

            <!-- The Big Action Selection Tiles (ユーザーの求める「投げ込むと選ぶ選択肢が出る」) -->
            <div class="action-tiles-container">
                <div class="action-tiles-grid">
                    <button type="button" class="action-tile-btn primary-tile" data-op="merge_compress" title="結合して圧縮（一番おすすめ）">
                        <i class="fa-solid fa-file-zipper tile-icon"></i>
                        <div class="tile-text">
                            <span class="tile-title">結合して圧縮</span>
                            <span class="tile-desc">人気・自動軽量化</span>
                        </div>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="compress" title="個別圧縮">
                        <i class="fa-solid fa-compress tile-icon"></i>
                        <div class="tile-text">
                            <span class="tile-title">個別圧縮</span>
                            <span class="tile-desc">サイズ削減</span>
                        </div>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="merge" title="結合のみ（無圧縮）">
                        <i class="fa-solid fa-object-group tile-icon"></i>
                        <div class="tile-text">
                            <span class="tile-title">結合のみ</span>
                            <span class="tile-desc">画質維持</span>
                        </div>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="split" title="1ページずつ分割">
                        <i class="fa-solid fa-scissors tile-icon"></i>
                        <div class="tile-text">
                            <span class="tile-title">ページ分割</span>
                            <span class="tile-desc">ZIP出力</span>
                        </div>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="to_png" title="PNG画像に変換">
                        <i class="fa-solid fa-image tile-icon"></i>
                        <div class="tile-text">
                            <span class="tile-title">画像変換</span>
                            <span class="tile-desc">高画質PNG</span>
                        </div>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="unlock" title="パスワード解除">
                        <i class="fa-solid fa-lock-open tile-icon"></i>
                        <div class="tile-text">
                            <span class="tile-title">ロック解除</span>
                            <span class="tile-desc">パスワード削除</span>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Hidden controls for JS backward compatibility -->
            <select id="operation-select" style="display: none;">
                <option value="merge_compress">結合して圧縮（ロック自動解除）</option>
                <option value="compress">個別にPDF圧縮</option>
                <option value="unlock">PDFのロック解除のみ</option>
                <option value="merge">PDFを結合のみ（無圧縮）</option>
                <option value="split">PDFを分割</option>
                <option value="to_jpg">JPG画像に変換</option>
                <option value="to_png">PNG画像に変換（高画質）</option>
                <option value="print">🖨️ PDFを印刷（プリンター出力）</option>
            </select>
            <button id="process-btn" style="display: none;"></button>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>処理を実行中...</p>
        </div>

        <!-- High-Res Zoom Preview Modal -->
        <div id="preview-modal" class="modal hidden">
            <div class="modal-content modal-preview">
                <div class="preview-header">
                    <div class="preview-title-info">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        <span id="preview-filename">ファイル名</span>
                        <span id="preview-page-indicator" class="page-badge">1 / 1 ページ</span>
                    </div>
                    <div class="preview-zoom-controls">
                        <button id="zoom-out-btn" class="btn btn-sm"><i class="fa-solid fa-minus"></i></button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in-btn" class="btn btn-sm"><i class="fa-solid fa-plus"></i></button>
                        <button id="close-preview-btn" class="btn btn-sm btn-danger"><i class="fa-solid fa-xmark"></i> 閉じる</button>
                    </div>
                </div>
                <div class="preview-body" id="preview-body">
                    <div class="preview-img-container">
                        <img id="preview-image" src="" alt="Page Preview" />
                    </div>
                </div>
                <div class="preview-footer">
                    <button id="prev-page-btn" class="btn btn-secondary"><i class="fa-solid fa-chevron-left"></i> 前のページ</button>
                    <span id="preview-page-number">ページ 1</span>
                    <button id="next-page-btn" class="btn btn-secondary">次のページ <i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <!-- Password Modal -->
        <div id="password-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <i class="fa-solid fa-lock modal-icon"></i>
                    <h3>PDFのパスワードが必要です</h3>
                </div>
                <p id="password-filename" class="modal-filename"></p>
                <p class="modal-desc">このPDFを開いて処理を続行するためのパスワードを入力してください。</p>
                <input type="password" id="modal-password-input" class="input-password" placeholder="パスワードを入力..." />
                <div class="modal-actions">
                    <button id="modal-cancel-btn" class="btn btn-secondary">キャンセル</button>
                    <button id="modal-submit-btn" class="btn btn-primary">送信して続行</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/app.js?v=5.0"></script>
</body>
</html>

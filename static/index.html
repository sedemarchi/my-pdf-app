<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local iLovePDF - 万能ツール</title>
    <link rel="stylesheet" href="css/style.css?v=7.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="widget-body">
    <!-- Slim Ultra-Minimal Header (Takes only ~28px) -->
    <header class="compact-header">
        <div class="logo" title="Local PDF/Image Tools">
            <img src="favicon.png" alt="Logo" class="logo-icon">
        </div>

        <div class="header-right-controls">
            <!-- Mode Toggle: Tools vs Auto-Print (Iconographic) -->
            <label class="mode-toggle-wrap" title="モード切替: ツール ⇄ 即時印刷">
                <i class="fa-solid fa-file-zipper mode-indicator-icon tool-active" id="icon-mode-tool" title="PDFツールモード"></i>
                <input type="checkbox" id="auto-print-toggle">
                <span class="slider round"></span>
                <i class="fa-solid fa-print mode-indicator-icon" id="icon-mode-print" title="即時印刷モード"></i>
            </label>

            <!-- Print Settings Inline (Shown only when Print Mode is ON) -->
            <div id="quick-print-panel" class="quick-print-inline hidden">
                <select id="printer-select" class="select-compact" title="プリンター選択">
                    <option value="">プリンター取得中...</option>
                </select>
            </div>
        </div>
    </header>

    <main class="widget-main">
        <!-- 1. The Immediate Drop Zone (Infographic Flow, Zero Text) -->
        <div id="drop-zone" class="widget-drop-zone" title="PDF・画像をドロップして結合・圧縮（クリックで選択）">
            <!-- Dynamic Infographic Flow -->
            <div class="infographic-flow">
                <div class="flow-sources">
                    <div class="flow-badge badge-pdf" title="PDF">
                        <i class="fa-solid fa-file-pdf"></i>
                    </div>
                    <span class="flow-op"><i class="fa-solid fa-plus"></i></span>
                    <div class="flow-badge badge-img" title="画像 (JPG/PNG/WebP)">
                        <i class="fa-solid fa-image"></i>
                    </div>
                </div>

                <div class="flow-arrow">
                    <i class="fa-solid fa-arrow-right-long arrow-pulse"></i>
                </div>

                <div class="flow-dest">
                    <div class="flow-badge badge-dest-tool" id="dest-badge" title="結合・圧縮PDF">
                        <i class="fa-solid fa-file-zipper" id="dest-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Micro Folder-Plus Button -->
            <button type="button" class="btn-icon-upload" id="file-select-btn" title="ファイルを選択">
                <i class="fa-solid fa-folder-open"></i>
                <i class="fa-solid fa-plus" style="font-size:0.6rem;"></i>
            </button>

            <input type="file" id="file-input" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.bmp,.tif,.tiff" style="display: none;">
        </div>

        <!-- 2. Action Panel (Revealed immediately when file(s) are dropped!) -->
        <div id="file-list-container" class="file-action-container hidden">
            <!-- Top compact info bar -->
            <div class="action-top-bar">
                <div class="top-bar-left">
                    <span id="file-count" class="badge-count" title="ファイル数"><i class="fa-solid fa-layer-group"></i> 0</span>
                    <div class="sort-toolbar-mini">
                        <button id="sort-date-btn" class="btn-mini btn-outline" title="スキャン日時順"><i class="fa-solid fa-clock"></i></button>
                        <button id="sort-name-btn" class="btn-mini btn-outline" title="ファイル名順"><i class="fa-solid fa-arrow-down-a-z"></i></button>
                    </div>
                </div>

                <div class="top-bar-right">
                    <button id="add-more-btn" class="btn-mini btn-outline" title="追加"><i class="fa-solid fa-plus"></i></button>
                    <button id="clear-all-btn" class="btn-mini btn-danger-outline" title="やり直す"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>

            <!-- Compact Thumbnails / Horizontal File List -->
            <div id="file-list" class="file-list-horizontal">
                <!-- Cards injected by JS -->
            </div>

            <!-- Output filename (compact inline) -->
            <div class="output-filename-compact" id="output-filename-box">
                <i class="fa-solid fa-wand-magic-sparkles" title="出力ファイル名"></i>
                <input type="text" id="output-filename-input" class="input-filename-compact" placeholder="Output..." />
                <button type="button" id="suggest-name-btn" class="btn-mini btn-outline" title="再解析"><i class="fa-solid fa-arrows-rotate"></i></button>
            </div>

            <!-- The Action Selection Tiles (Iconographic Minimal) -->
            <div class="action-tiles-container">
                <div class="action-tiles-grid">
                    <button type="button" class="action-tile-btn primary-tile" data-op="merge_compress" title="結合して圧縮（一番おすすめ）">
                        <i class="fa-solid fa-file-zipper tile-icon"></i>
                        <span class="tile-title">結合＋圧縮</span>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="compress" title="個別圧縮">
                        <i class="fa-solid fa-compress tile-icon"></i>
                        <span class="tile-title">圧縮</span>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="merge" title="結合のみ（無圧縮）">
                        <i class="fa-solid fa-object-group tile-icon"></i>
                        <span class="tile-title">結合</span>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="split" title="1ページずつ分割">
                        <i class="fa-solid fa-scissors tile-icon"></i>
                        <span class="tile-title">分割</span>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="to_png" title="PNG画像に変換">
                        <i class="fa-solid fa-image tile-icon"></i>
                        <span class="tile-title">画像化</span>
                    </button>

                    <button type="button" class="action-tile-btn" data-op="unlock" title="パスワード解除">
                        <i class="fa-solid fa-lock-open tile-icon"></i>
                        <span class="tile-title">解除</span>
                    </button>
                </div>
            </div>

            <!-- Hidden controls for JS backward compatibility -->
            <select id="operation-select" style="display: none;">
                <option value="merge_compress">結合して圧縮（ロック自動解除）</option>
                <option value="compress">個別にPDF圧縮</option>
                <option value="unlock">PDFのロック解除のみ</option>
                <option value="merge">PDFを結合のみ（無圧縮）</option>
                <option value="split">PDFを分割</option>
                <option value="to_jpg">JPG画像に変換</option>
                <option value="to_png">PNG画像に変換（高画質）</option>
                <option value="print">🖨️ PDFを印刷（プリンター出力）</option>
            </select>
            <button id="process-btn" style="display: none;"></button>
        </div>

        <!-- 3. Result Preview & Action Card (Shown after processing) -->
        <div id="process-result-card" class="widget-result-card hidden">
            <div class="result-badge-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="result-info-box">
                <div class="result-filename" id="result-filename-display">result.pdf</div>
                <div class="result-stats" id="result-stats-display">-- ページ • -- KB</div>
            </div>
            <div class="result-actions">
                <button type="button" class="btn-result-preview" id="btn-reopen-preview" title="プレビューを別ウィンドウで確認">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> プレビュー
                </button>
                <button type="button" class="btn-result-download" id="btn-result-download" title="ファイルを保存">
                    <i class="fa-solid fa-download"></i> 保存
                </button>
            </div>
            <button type="button" class="btn-result-new" id="btn-result-new" title="新しい作業を開始">
                <i class="fa-solid fa-rotate-left"></i> 新規
            </button>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>処理を実行中...</p>
        </div>

        <!-- High-Res Zoom Preview Modal -->
        <div id="preview-modal" class="modal hidden">
            <div class="modal-content modal-preview">
                <div class="preview-header">
                    <div class="preview-title-info">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                        <span id="preview-filename">ファイル名</span>
                        <span id="preview-page-indicator" class="page-badge">1 / 1 ページ</span>
                    </div>
                    <div class="preview-zoom-controls">
                        <button id="zoom-out-btn" class="btn btn-sm"><i class="fa-solid fa-minus"></i></button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in-btn" class="btn btn-sm"><i class="fa-solid fa-plus"></i></button>
                        <button id="close-preview-btn" class="btn btn-sm btn-danger"><i class="fa-solid fa-xmark"></i> 閉じる</button>
                    </div>
                </div>
                <div class="preview-body" id="preview-body">
                    <div class="preview-img-container">
                        <img id="preview-image" src="" alt="Page Preview" />
                    </div>
                </div>
                <div class="preview-footer">
                    <button id="prev-page-btn" class="btn btn-secondary"><i class="fa-solid fa-chevron-left"></i> 前のページ</button>
                    <span id="preview-page-number">ページ 1</span>
                    <button id="next-page-btn" class="btn btn-secondary">次のページ <i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <!-- Password Modal -->
        <div id="password-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <i class="fa-solid fa-lock modal-icon"></i>
                    <h3>PDFのパスワードが必要です</h3>
                </div>
                <p id="password-filename" class="modal-filename"></p>
                <p class="modal-desc">このPDFを開いて処理を続行するためのパスワードを入力してください。</p>
                <input type="password" id="modal-password-input" class="input-password" placeholder="パスワードを入力..." />
                <div class="modal-actions">
                    <button id="modal-cancel-btn" class="btn btn-secondary">キャンセル</button>
                    <button id="modal-submit-btn" class="btn btn-primary">送信して続行</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/app.js?v=5.0"></script>
</body>
</html>
